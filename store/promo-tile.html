<!doctype html>
<!-- Chrome Web Store small promo tile (440x280). Render: headless Chrome at 2x, then scale to 440x280 with no alpha channel. --><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:440px;height:280px;overflow:hidden}
body{position:relative;font-family:-apple-system,"SF Pro Display","Segoe UI",sans-serif;color:#fff;
background:radial-gradient(120% 140% at 0% 0%,#4aa3ff 0%,#2f6fe0 45%,#3b3fc9 100%)}
.glow{position:absolute;width:260px;height:260px;right:-60px;top:-40px;border-radius:50%;background:radial-gradient(circle,#5ef2c0aa,transparent 65%)}
.txt{position:absolute;left:30px;top:50%;transform:translateY(-50%)}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:23px;opacity:.97}
.brand img{width:42px;height:42px}
h1{margin:14px 0 0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-1px}
h1 span{color:#9ff5d6}
.card{position:absolute;right:-34px;top:58px;width:210px;height:132px;border-radius:16px;transform:rotate(-12deg);
background:linear-gradient(135deg,rgba(255,255,255,.38),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.55);
box-shadow:0 20px 40px rgba(20,20,90,.35);backdrop-filter:blur(6px)}
.chip{position:absolute;left:18px;top:30px;width:30px;height:22px;border-radius:5px;background:linear-gradient(135deg,#ffe08a,#f2b33d)}
.num{position:absolute;left:18px;bottom:30px;font-size:15px;letter-spacing:2px;font-weight:600}
.lbl{position:absolute;right:44px;top:16px;font-size:9px;letter-spacing:2px;font-weight:700;opacity:.9}
.pill{position:absolute;right:58px;bottom:34px;display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:12px;background:#fff;color:#0f4f8a;font-weight:700;font-size:13px;box-shadow:0 10px 24px rgba(20,20,90,.35)}
.pill i{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#22a06b;color:#fff;font-style:normal;font-size:11px;align-items:center;justify-content:center}
</style></head><body><div class="glow"></div>

<div class="card"><div class="lbl">VIRTUAL</div><div class="chip"></div><div class="num">•••• 4821</div></div>

<div class="txt"><div class="brand"><img src="../src/icons/icon.svg" alt="">CardHop</div><h1>Your shortcut<br>to <span>virtual cards.</span></h1></div>
</body></html>
