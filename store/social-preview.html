<!doctype html>
<!-- GitHub social preview (1280x640). Render: headless Chrome at 2x, then scale to 1280x640. --><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{position:relative;font-family:-apple-system,"SF Pro Display","Segoe UI",sans-serif;color:#fff;
background:radial-gradient(120% 140% at 0% 0%,#4aa3ff 0%,#2f6fe0 45%,#3b3fc9 100%)}
.glow{position:absolute;width:720px;height:720px;right:-160px;top:-160px;border-radius:50%;background:radial-gradient(circle,#5ef2c0aa,transparent 65%)}
.txt{position:absolute;left:110px;top:50%;transform:translateY(-50%)}
.brand{display:flex;align-items:center;gap:26px;font-weight:700;font-size:60px;opacity:.97}
.brand img{width:104px;height:104px}
h1{margin:34px 0 0;font-size:84px;line-height:1.08;font-weight:800;letter-spacing:-2.5px}
h1 span{color:#9ff5d6}
.sub{margin-top:30px;font-size:28px;font-weight:600;opacity:.85}
.card{position:absolute;right:-40px;top:170px;width:500px;height:314px;border-radius:36px;transform:rotate(-12deg);
background:linear-gradient(135deg,rgba(255,255,255,.38),rgba(255,255,255,.12));border:2px solid rgba(255,255,255,.55);
box-shadow:0 44px 88px rgba(20,20,90,.35);backdrop-filter:blur(12px)}
.chip{position:absolute;left:44px;top:74px;width:70px;height:52px;border-radius:11px;background:linear-gradient(135deg,#ffe08a,#f2b33d)}
.num{position:absolute;left:44px;bottom:72px;font-size:36px;letter-spacing:5px;font-weight:600}
.lbl{position:absolute;right:100px;top:38px;font-size:21px;letter-spacing:5px;font-weight:700;opacity:.9}
</style></head><body><div class="glow"></div>

<div class="card"><div class="lbl">VIRTUAL</div><div class="chip"></div><div class="num">•••• 4821</div></div>

<div class="txt"><div class="brand"><img src="../src/icons/icon.svg" alt="">CardHop</div><h1>Your shortcut<br>to <span>virtual cards.</span></h1><div class="sub">For Capital One® and Citi® · Chrome, Edge &amp; Firefox</div></div>
</body></html>
